      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/RangeTail/comparator.json"
      literature_dependencies: []
    - declaration: "ORRWAudit.range_ae"
      file: "Audit/RangeAlmostSure/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Audit/RangeAlmostSure/comparator.json"
      literature_dependencies: []
    - declaration: "ORRWAudit.occupation_measure"
