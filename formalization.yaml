version: "v0.4"

project:
  name: "ORRW-Lower-Bound"
  description: >-
    A Lean formalization of the paper "Once-reinforced random walk on Z^d has
    range exponent at least d/(d+1)" by Bou-Rabee and Peres: for d >= 2 and
    reinforcement beta >= 1, the expected range of once-reinforced random walk
    is at least c beta^(-d/(d+1)) n^(d/(d+1)) (Theorem 1.1), with a
    stretched-exponential lower tail (Theorem 1.2), the almost-sure bound it
    implies, and a bound on the occupation measure (Theorem 1.3). Every lemma
    and proposition behind them is formalized as well, and nothing is assumed.
    The four main theorems are independently checked using the ORRWAudit/
    comparator pairs.
  authors:
    - "Ahmed Bou-Rabee"
  license: "Apache-2.0"

sources:
  - title: "Once-reinforced random walk on Z^d has range exponent at least d/(d+1)"
    authors:
      - "Ahmed Bou-Rabee"
      - "Yuval Peres"
    id: ""                      # TODO(author): the arXiv identifier (submitted 2026-09-07, pending)
    url: ""
    type: "preprint"
    relationship: "formalizes"
    note: >-
      The paper under formalization. Every theorem, lemma and proposition is
      formalized; see status.scope for the precise scope and
      fidelity.divergences for the differences in formulation.
    license: ""                 # TODO(author): the license under which the paper is posted
    author_endorsement: "n/a"   # the formalizer is an author of the source

related_formalizations:
  - id: "https://github.com/nitromannitol/Lattice-Probability"
    relationship: "builds-on"
    note: >-
      Lattice-Probability (LatticeProb), a separate library shared by several
      formalizations, pinned as a git dependency at commit bbe0b90. It
      provides the lattice objects that do not depend on the reinforced walk:
      the Dirichlet Laplacian, exit times, effective resistance, the resistance
      packing bound, the insertion inequality, the lazy walk and its Green
      function, and the elementary geometry of direction words.

status:
  scope: >-
    A Lean 4 / Mathlib formalization of every theorem, lemma and proposition of
    the paper: the range lower bound E|R_n| >= c beta^(-d/(d+1)) n^(d/(d+1))
    (Theorem 1.1), its stretched-exponential lower tail (Theorem 1.2) and the
    almost-sure bound drawn from it, the occupation measure bound (Theorem
    1.3), and the lemmas and propositions of Sections 2 to 8 behind them, 24
    registered statements in all, including a second almost-sure conclusion
    (Proposition 6.1), four guards on the model and the identification of the
    infinite-path law with the finite-horizon law.  SCOPE BOUNDARY: nothing is
    assumed; no cited result is taken as a hypothesis (ASSUMPTIONS.md).  Not
    formalized: the survey of related work, the simulations, the figures, the
    open questions, and the electrical interpretation of effective resistance,
    which is defined by the inverse diagonal of the Dirichlet Laplacian.  The
    main theorems are stated in full in ORRW/MainTheorems.lean; all four are
    additionally restated over a Mathlib-only vocabulary for the Lean
    comparator (ORRWAudit/).
  sorry_count: 0
  sorry_count_scope: "ORRW production library only"
  comparator_challenge_sorry_count: 4
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "ORRW.range_lower_bound"
      file: "ORRW/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/RangeLowerBound/comparator.json"
      literature_dependencies: []
    - declaration: "ORRW.range_tail"
      file: "ORRW/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/RangeTail/comparator.json"
      literature_dependencies: []
    - declaration: "ORRW.range_ae"
      file: "ORRW/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/RangeAlmostSure/comparator.json"
      literature_dependencies: []
    - declaration: "ORRW.occupation_measure"
      file: "ORRW/MainTheorems.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/OccupationMeasure/comparator.json"
      literature_dependencies: []
    - declaration: "ORRWAudit.range_lower_bound"
      file: "ORRWAudit/RangeLowerBound/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/RangeLowerBound/comparator.json"
      literature_dependencies: []
    - declaration: "ORRWAudit.range_tail"
      file: "ORRWAudit/RangeTail/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/RangeTail/comparator.json"
      literature_dependencies: []
    - declaration: "ORRWAudit.range_ae"
      file: "ORRWAudit/RangeAlmostSure/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/RangeAlmostSure/comparator.json"
      literature_dependencies: []
    - declaration: "ORRWAudit.occupation_measure"
      file: "ORRWAudit/OccupationMeasure/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ORRWAudit/OccupationMeasure/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models:
        - "claude-opus-5"
        - "claude-haiku-4-5"
        - "glm-5.3"
        - "glm-5.3-flash"
        - "gpt-6-astra"
        - "claude-sonnet-5"
        - "claude-opus-5-5"
      framework: >-
        Claude Code (Anthropic) as the supervising and proving harness, which
        wrote nearly all of the Lean code; Codex CLI (OpenAI, reasoning effort
        xhigh) for gpt-6-astra; scripted API fan-outs on the ollama cloud for
        the GLM models
      tool_setup: >-
        Lake builds under leanprover/lean4:v4.32.0 with Mathlib at revision
        81a5d257c8e410db227a6665ed08f64fea08e997 and the shared library
        Lattice-Probability at commit bbe0b90.  A frozen-statement manifest
        (ledger/manifest.yaml) pins each registered statement by the SHA-256
        of its text, and the tools/ checkers verify the hashes, the axiom
        closure of every node, a warning-free build, coverage of every
        statement of the paper, a recorded clause-by-clause reading of each
        statement, quantifier order and exponents.  The Lean comparator
        (leanprover/comparator) passes on all four ORRWAudit pairs with the Lean
        kernel and with the independent nanoda kernel; ORRWAudit/COMPARATOR_RUNS.md
        records the pins, the results and the reproduction steps, and
        .github/workflows/comparator.yml runs it on request.
      cost:
        wall_time: "about two days for the formalization, then about two further days for the shared library and the comparator surface"
        spend_usd: "not tracked (subscription and API accounts)"
        hardware: "a 20-thread Intel i9-9900X / 125 GB RAM Ubuntu machine"
      prompting_notes: >-
        Human-directed agent work, supervised by the author, with the author's
        rulings recorded for statement-level decisions.  Every statement was
        pinned before its proof was attempted, and proofs were accepted only
        through the manifest and axiom gates.
  spend_usd: "not tracked (subscription and API accounts)"
  notes: >-
    All Lean code in this repository was written by the listed models under the
    supervision of the author.  Every proof is checked by the Lean kernel and
    Mathlib; the verified library contains no sorry and no custom axiom, and
    no cited result enters as a hypothesis.  The Mathlib-only comparator
    challenge files (ORRWAudit/*/Challenge.lean) each contain exactly one
    intentional statement-level sorry (the theorem body), which is filled by
    the corresponding ORRWAudit/*/Solution.lean.  The dependency
    Lattice-Probability is a separate library shared by several
    formalizations.  No available record identifies the tool that produced
    VERIFICATION.md, ORRW/Certificate.lean and the continuous-integration
    workflows.

fidelity:
  divergences: >-
    VERIFICATION.md and CORRESPONDENCE.md record where a Lean statement is not
    literally the paper's.  In summary: the law of the first n steps is a
    probability mass function on direction words, and the almost-sure
    conclusions use the infinite-path law built by the Ionescu-Tulcea theorem,
    whose finite-dimensional marginals are proved to be that law; the
    almost-sure conclusions are proved as eventual lower bounds, which imply
    the printed bounds on the lower limit; some statements carry separate
    constants c and C where the paper writes one C >= 1; effective resistance
    is defined by the inverse diagonal of the Dirichlet Laplacian, so the
    electrical interpretation in Lemma 2.2 is a definition; Lemma 3.1 is
    stated as the equivalent one-step drift inequality, and Lemma 5.1 for
    finite-history processes with a predictable clock; a supremum over sites
    is a universal quantifier inside the constant's scope; and the frozen
    time-averaged occupation bound is weaker than the display eq:cesaro,
    whose sharper dependence on beta the interval bound of Theorem 8.2 keeps.

review:
  status: "author-verified"
  reviewers:
    - "Ahmed Bou-Rabee"
  notes: >-
    Correctness of every proof is guaranteed by the Lean kernel and Mathlib (no
    sorry, no custom axiom).  The author ruled on the statement-level
    decisions.  The statements were additionally audited against the paper,
    node by node, by claude-opus-5 and glm-5.3 model auditors, and six results
    by a read-only gpt-6-astra fidelity audit, which found no substantive
    mismatch.  This is not external peer review.

alignment:
  namespace: "ORRW"
  statements:
    - source: "Theorem 1.1 (thm:main)"
      lean: "ORRW.range_lower_bound"
      module: "ORRW.MainTheorems"
      status: "proved"
      note: "Certified statement ORRW.Frozen.range_lower_bound (thm-main). Comparator challenge ORRWAudit/RangeLowerBound/."
    - source: "Theorem 1.2 (thm:whp)"
      lean: "ORRW.range_tail"
      module: "ORRW.MainTheorems"
      status: "proved"
      note: "Certified statement ORRW.Frozen.range_tail (thm-whp). Comparator challenge ORRWAudit/RangeTail/."
    - source: "The almost-sure bound stated after Theorem 1.2 (thm:whp)"
      lean: "ORRW.range_ae"
      module: "ORRW.MainTheorems"
      status: "proved"
      note: "Certified statement ORRW.Frozen.range_ae (ae-range). Comparator challenge ORRWAudit/RangeAlmostSure/."
    - source: "Theorem 1.3 (thm:occupation-intro)"
      lean: "ORRW.occupation_measure"
      module: "ORRW.MainTheorems"
      status: "proved"
      note: "Certified statement ORRW.Frozen.occupation_measure (thm-occupation-measure). Comparator challenge ORRWAudit/OccupationMeasure/."
    - source: "Sections 2 to 8: every lemma, proposition and theorem"
      lean: "ORRW.Frozen.*"
      module: "ORRW.Frozen"
      status: "proved"
      note: "One registered statement per paper statement; the full map is in README.md and CORRESPONDENCE.md."

acknowledgements: >-
  The paper is joint work with Yuval Peres.  Built on Lean 4, Mathlib, Lake,
  the shared library Lattice-Probability, and leanprover/comparator.
